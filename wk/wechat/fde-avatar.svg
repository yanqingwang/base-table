<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="78%">
      <stop offset="0%" stop-color="#16264f"/>
      <stop offset="55%" stop-color="#0c1530"/>
      <stop offset="100%" stop-color="#060a18"/>
    </radialGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FF0FF"/>
      <stop offset="50%" stop-color="#3B8BFF"/>
      <stop offset="100%" stop-color="#7A5CFF"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4FF0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7A5CFF" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#3fa9ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <rect width="1080" height="1080" fill="url(#grid)"/>

  <!-- tech accent dots -->
  <g fill="#4FF0FF" fill-opacity="0.5">
    <circle cx="180" cy="180" r="4"/>
    <circle cx="900" cy="200" r="3"/>
    <circle cx="140" cy="900" r="3"/>
    <circle cx="940" cy="880" r="4"/>
  </g>
  <g stroke="#3B8BFF" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M180 180 L300 300"/>
    <path d="M900 200 L800 320"/>
    <path d="M140 900 L280 820"/>
  </g>

  <!-- avatar badge -->
  <circle cx="540" cy="492" r="298" fill="#0a1228" fill-opacity="0.55"/>
  <circle cx="540" cy="492" r="298" fill="none" stroke="url(#ring)" stroke-width="3"/>
  <circle cx="540" cy="492" r="312" fill="none" stroke="#4FF0FF" stroke-opacity="0.12" stroke-width="1"/>

  <!-- monogram FDE (geometric block letters) -->
  <g fill="url(#mono)" filter="url(#glow)">
    <!-- F : origin (210,382) -->
    <rect x="210" y="382" width="60" height="300"/>
    <rect x="210" y="382" width="180" height="60"/>
    <rect x="210" y="502" width="180" height="60"/>
    <!-- D : origin (450,382) -->
    <rect x="450" y="382" width="60" height="300"/>
    <rect x="450" y="382" width="180" height="60"/>
    <rect x="450" y="622" width="180" height="60"/>
    <rect x="570" y="382" width="60" height="300"/>
    <!-- E : origin (690,382) -->
    <rect x="690" y="382" width="60" height="300"/>
    <rect x="690" y="382" width="180" height="60"/>
    <rect x="690" y="502" width="180" height="60"/>
    <rect x="690" y="622" width="180" height="60"/>
  </g>

  <!-- caption -->
  <text x="540" y="872" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" letter-spacing="10" fill="#cfe2ff" fill-opacity="0.9">@FDE</text>
  <text x="540" y="930" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="400" letter-spacing="16" fill="#5a7bbf" fill-opacity="0.75">科技博主 · TECH CREATOR</text>
</svg>
