[package]
name = "base-table"
version = "0.1.0"
description = "Local-first multidimensional table desktop MVP"
authors = ["Base Table"]
edition = "2021"

[features]
default = []
desktop = ["tauri", "tauri-plugin-dialog"]

[lib]
name = "base_table"
path = "src/lib.rs"

[[bin]]
name = "base-table"
path = "src/main.rs"
required-features = ["desktop"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [], optional = true }
tauri-plugin-dialog = { version = "2.0.0", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
zip = "2.4.2"
