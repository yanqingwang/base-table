name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-tauri:
    name: Build Linux Tauri bundle
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test

      - name: Test backend
        working-directory: src-tauri
        run: cargo test

      - name: Build Tauri bundle
        run: npm run tauri:build

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-table-linux-bundle
          path: src-tauri/target/release/bundle/**/*

  windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Test frontend
        run: npm run test

      - name: Test backend
        working-directory: src-tauri
        run: cargo test

      - name: Build Windows x64 NSIS installer
        run: npm run tauri -- build --features desktop --bundles nsis

      - name: Upload Windows x64 installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-table-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  arch-package:
    name: Build Arch package
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build in Arch Linux
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: x86_64
          distro: archlinux_latest
          install: |
            pacman -Syu --noconfirm --needed \
              base-devel \
              nodejs \
              npm \
              rust \
              gtk3 \
              webkit2gtk-4.1 \
              libayatana-appindicator \
              librsvg \
              openssl \
              pkgconf
          run: |
            npm ci
            ./packaging/arch/build-arch-package.sh

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-table-arch-package
          path: packaging/arch/*.pkg.tar.*

  publish:
    name: Publish GitHub Release
    needs:
      - linux-tauri
      - windows-installer
      - arch-package
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
