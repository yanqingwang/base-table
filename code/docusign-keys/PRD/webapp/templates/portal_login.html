{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 60px auto;">
    <div class="card">
        <h1 style="text-align:center; font-size:20px; margin-bottom:24px;">员工自助门户</h1>

        {% if error %}
            <div class="flash flash-error">{{ error }}</div>
        {% endif %}

        <form id="loginForm" method="POST" action="/portal/verify">
            <div class="form-group">
                <label>邮箱</label>
                <input type="email" name="email" id="emailInput" placeholder="you@company.com" required>
            </div>
            <div class="form-group">
                <button type="button" class="btn" id="sendCodeBtn" style="width:100%;" onclick="sendCode()">发送验证码</button>
            </div>
            <hr style="margin:20px 0; border:none; border-top:1px solid #eee;">
            <div class="form-group">
                <label>验证码</label>
                <input type="text" name="code" placeholder="6 位验证码" maxlength="6" required>
            </div>
            <button type="submit" class="btn btn-success" style="width:100%;">登录</button>
        </form>
    </div>

    <div style="text-align:center; margin-top:16px; font-size:12px; color:#999;">
        开发环境：验证码会打印在控制台
    </div>
</div>

<script>
function sendCode() {
    var email = document.getElementById('emailInput').value;
    if (!email) { alert('请输入邮箱'); return; }
    var btn = document.getElementById('sendCodeBtn');
    btn.disabled = true;
    btn.textContent = '发送中...';
    var formData = new FormData();
    formData.append('email', email);
    fetch('/portal/send-code', { method:'POST', body: formData })
        .then(function(r) { return r.json(); })
        .then(function(data) {
            if (data.error) { alert(data.error); }
            else { alert(data.msg); }
            btn.disabled = false;
            btn.textContent = '发送验证码';
        })
        .catch(function() {
            alert('发送失败');
            btn.disabled = false;
            btn.textContent = '发送验证码';
        });
}
</script>
{% endblock %}
