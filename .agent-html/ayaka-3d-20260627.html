<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>神里凌华 · 3D 模型 | Kamisato Ayaka 3D</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#080610; overflow:hidden;
  font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:rgba(200,220,255,0.5);
}
#info {
  position:absolute; top:18px; left:50%; transform:translateX(-50%);
  font-size:14px; letter-spacing:4px; text-align:center;
  color:rgba(180,210,255,0.4); text-shadow:0 0 40px rgba(100,180,255,0.06);
  pointer-events:none; z-index:10;
}
#info .sub { font-size:10px; letter-spacing:2px; color:rgba(180,210,255,0.15); }
#status {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  color:rgba(180,210,255,0.2); font-size:13px; letter-spacing:3px;
  z-index:1; text-align:center; transition:opacity 0.5s;
}
#status .spinner { display:inline-block; animation:spin 1.2s linear infinite; }
@keyframes spin { 0%{transform:rotate(0)} 100%{transform:rotate(360deg)} }
#stats {
  position:absolute; bottom:22px; left:50%; transform:translateX(-50%);
  display:flex; gap:28px; font-size:11px;
  background:rgba(8,6,16,0.7); padding:8px 28px; border-radius:20px;
  border:1px solid rgba(100,180,255,0.06); pointer-events:none; z-index:10;
}
.stat { text-align:center; }
.stat-lbl { font-size:9px; color:rgba(180,210,255,0.2); }
.stat-val { font-size:14px; color:rgba(180,210,255,0.35); }
#controls {
  position:absolute; bottom:80px; right:24px; display:flex; flex-direction:column; gap:6px; z-index:10;
}
#controls button {
  background:rgba(100,150,255,0.04); border:1px solid rgba(100,180,255,0.1);
  color:rgba(180,210,255,0.3); padding:5px 14px; border-radius:5px;
  font-size:10px; cursor:pointer; font-family:inherit; letter-spacing:1px;
  transition:all 0.25s;
}
#controls button:hover { background:rgba(100,180,255,0.08); border-color:rgba(100,180,255,0.2); }
#controls button.on { border-color:rgba(100,200,255,0.25); color:rgba(180,220,255,0.5); }
#tex-status {
  position:absolute; bottom:80px; left:24px; z-index:10;
  font-size:9px; color:rgba(180,210,255,0.12); letter-spacing:1px;
}
</style>
</head>
<body>
<div id="info">✦ 神里凌华 · 白鹭霜华 ✦<br><span class="sub">KAMISATO AYAKA · YASHIRO COMMISSION</span></div>
<div id="status"><span class="spinner">◌</span> 加载模型中...</div>
<div id="stats">
  <div class="stat"><div class="stat-lbl">顶点</div><div class="stat-val" id="s-vtx">—</div></div>
  <div class="stat"><div class="stat-lbl">面片</div><div class="stat-val" id="s-face">—</div></div>
  <div class="stat"><div class="stat-lbl">来源</div><div class="stat-val">Game Files</div></div>
</div>
<div id="tex-status"></div>
<div id="controls">
  <button id="btn-spin" class="on">⟳ 自转</button>
  <button id="btn-idle" class="on">◊ 待机</button>
  <button id="btn-wire">▦ 线框</button>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

// ─── Scene ───
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0a0812);
scene.fog = new THREE.Fog(0x0a0812, 8, 18);

const camera = new THREE.PerspectiveCamera(28, window.innerWidth / window.innerHeight, 0.1, 30);
camera.position.set(3.5, 1.8, 4.5);
camera.lookAt(0, 0.8, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.insertBefore(renderer.domElement, document.body.firstChild);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.9, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 2.5;
controls.minDistance = 2;
controls.maxDistance = 10;
controls.update();

// ─── Lights ───
const ambient = new THREE.AmbientLight(0x4466aa, 0.25);
scene.add(ambient);

const hemi = new THREE.HemisphereLight(0x8888ff, 0x444422, 0.6);
scene.add(hemi);

const main = new THREE.DirectionalLight(0xeeddff, 2.0);
main.position.set(4, 8, 5);
main.castShadow = true;
scene.add(main);

const fill = new THREE.DirectionalLight(0x6688cc, 0.5);
fill.position.set(-3, 2, -4);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xaaccff, 1.2);
rim.position.set(-1, 3, -5);
scene.add(rim);

const bot = new THREE.DirectionalLight(0x223366, 0.2);
bot.position.set(0, -1, 0);
scene.add(bot);

// ─── Ground ───
const grid = new THREE.GridHelper(6, 12, 0x1a2040, 0x0a1020);
grid.position.y = -0.02;
grid.material.transparent = true;
grid.material.opacity = 0.12;
scene.add(grid);

const ring = new THREE.Mesh(
  new THREE.RingGeometry(0.3, 2.0, 48),
  new THREE.MeshBasicMaterial({ color: 0x1a3050, transparent: true, opacity: 0.04, side: THREE.DoubleSide })
);
ring.rotation.x = -Math.PI / 2;
ring.position.y = -0.01;
scene.add(ring);

// ─── Model Dir (base for texture loading) ───
// Textures embedded as base64 data URIs from the downloaded files
const MODEL_URL = 'https://raw.githubusercontent.com/zeroruka/GI-Assets/main/Models/Characters/Kamisato%20Ayaka/Default/NPC_Avatar_Girl_Sword_Ayaka%20(merge).fbx';
const TEX_BASE = 'https://raw.githubusercontent.com/zeroruka/GI-Assets/main/Models/Characters/Kamisato%20Ayaka/Default/';

// ─── Load model ───
const loader = new FBXLoader();
let model = null;
let mixer = null;

loader.load(
  MODEL_URL,
  (fbx) => {
    model = fbx;
    model.scale.set(0.01, 0.01, 0.01);
    model.position.y = 0;
    scene.add(model);

    // Find and assign textures
    const texLoader = new THREE.TextureLoader();
    const textureMap = {
      'Body_Diffuse': 'Avatar_Girl_Sword_Ayaka_Tex_Body_Diffuse.png',
      'Body_Lightmap': 'Avatar_Girl_Sword_Ayaka_Tex_Body_Lightmap.png',
      'Face_Diffuse': 'Avatar_Girl_Sword_Ayaka_Tex_Face_Diffuse.png',
      'Face_Lightmap': 'Avatar_Girl_Tex_FaceLightmap.png',
      'Face_Shadow': 'Avatar_Tex_Face_Shadow.png',
      'Hair_Diffuse': 'Avatar_Girl_Sword_Ayaka_Tex_Hair_Diffuse.png',
      'Hair_Lightmap': 'Avatar_Girl_Sword_Ayaka_Tex_Hair_Lightmap.png',
      'MetalMap': 'Avatar_Tex_MetalMap.png',
    };

    let loadedTextures = 0;
    const totalTex = Object.keys(textureMap).length;

    model.traverse(child => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;

        // Try to apply textures based on material/geometry name hints
        const mat = child.material;
        if (mat) {
          const name = (child.name + ' ' + mat.name).toLowerCase();
          
          // Determine texture type from name
          let texType = null;
          if (name.includes('body') || name.includes('dress') || name.includes('cloth')) texType = 'Body';
          else if (name.includes('face') || name.includes('head') || name.includes('skin')) texType = 'Face';
          else if (name.includes('hair')) texType = 'Hair';

          if (texType) {
            const diffKey = texType + '_Diffuse';
            const lightKey = texType + '_Lightmap';
            const metalKey = 'MetalMap';
            const shadowKey = 'Face_Shadow';
            const faceLightKey = 'Face_Lightmap';

            if (textureMap[diffKey]) {
              texLoader.load(TEX_BASE + textureMap[diffKey], (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                mat.map = tex;
                mat.needsUpdate = true;
                loadedTextures++;
                document.getElementById('tex-status').textContent =
                  `纹理: ${loadedTextures}/${totalTex}`;
              });
            }
            if (textureMap[lightKey]) {
              texLoader.load(TEX_BASE + textureMap[lightKey], (tex) => {
                mat.lightMap = tex;
                mat.lightMapIntensity = 0.8;
                mat.needsUpdate = true;
              });
            }
            if (texType === 'Body' && textureMap[metalKey]) {
              texLoader.load(TEX_BASE + textureMap[metalKey], (tex) => {
                mat.roughnessMap = tex;
                mat.metalnessMap = tex;
                mat.needsUpdate = true;
              });
            }
            if (texType === 'Face' && textureMap[shadowKey]) {
              texLoader.load(TEX_BASE + textureMap[shadowKey], (tex) => {
                // Use as subsurface/translucency approximation
                mat.needsUpdate = true;
              });
            }
            if (texType === 'Face' && textureMap[faceLightKey]) {
              texLoader.load(TEX_BASE + textureMap[faceLightKey], (tex) => {
                mat.needsUpdate = true;
              });
            }
          }

          // Set material properties for anime-style rendering
          if (mat.roughness !== undefined) {
            if (name.includes('hair')) {
              mat.roughness = 0.3;
              mat.metalness = 0.05;
            } else if (name.includes('body') || name.includes('dress') || name.includes('cloth')) {
              mat.roughness = 0.2;
              mat.metalness = 0.1;
            } else if (name.includes('skin') || name.includes('face')) {
              mat.roughness = 0.6;
              mat.metalness = 0.0;
            } else if (name.includes('metal') || name.includes('armor') || name.includes('gold')) {
              mat.roughness = 0.15;
              mat.metalness = 0.8;
            }
          }
        }
      }
    });

    // Compute mesh stats
    let vtx = 0, face = 0;
    model.traverse(c => {
      if (c.isMesh && c.geometry) {
        const pos = c.geometry.getAttribute('position');
        if (pos) vtx += pos.count;
        if (c.geometry.index) face += c.geometry.index.count / 3;
        else if (pos) face += pos.count / 3;
      }
    });
    document.getElementById('s-vtx').textContent = Math.round(vtx).toLocaleString();
    document.getElementById('s-face').textContent = Math.round(face).toLocaleString();

    document.getElementById('status').style.opacity = '0';
    setTimeout(() => document.getElementById('status').remove(), 500);

    // ─── Idle animation ───
    // Gentle bobbing via simple sine
    let idleTime = 0;
    let idleActive = true;
    window.__idleUpdate = (dt) => {
      if (!model || !idleActive) return;
      idleTime += dt;
      // Subtle breathing/float
      const bob = Math.sin(idleTime * 1.2) * 0.003;
      model.position.y = bob;
    };
    window.__toggleIdle = (on) => { idleActive = on; };

    console.log('✓ Ayaka model loaded');
  },
  (xhr) => {
    const pct = Math.round((xhr.loaded / xhr.total) * 100);
    document.getElementById('status').innerHTML =
      `<span class="spinner">◌</span> 加载模型中... ${isNaN(pct) ? '' : pct + '%'}`;
  },
  (err) => {
    console.error('FBX load error:', err);
    document.getElementById('status').innerHTML = '✗ 模型加载失败<br><span style="font-size:10px">' + err.message + '</span>';
  }
);

// ─── Cryo Particles ───
const particleCount = 60;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pSizes = new Float32Array(particleCount);
const pData = [];

for (let i = 0; i < particleCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const r = 0.3 + Math.random() * 1.0;
  pPos[i*3] = Math.cos(theta) * r;
  pPos[i*3+1] = 0.2 + Math.random() * 1.6;
  pPos[i*3+2] = Math.sin(theta) * r;
  pSizes[i] = 0.008 + Math.random() * 0.02;
  pData.push({
    baseY: pPos[i*3+1],
    speed: 0.3 + Math.random() * 0.5,
    phase: Math.random() * Math.PI * 2,
    radius: r,
    angle: theta,
  });
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('size', new THREE.BufferAttribute(pSizes, 1));

const pMat = new THREE.PointsMaterial({
  color: 0x88ddff, size: 0.02,
  transparent: true, opacity: 0.25,
  blending: THREE.AdditiveBlending, depthWrite: false,
});
const particles = new THREE.Points(pGeo, pMat);
scene.add(particles);

// Ice shards
const shardGroup = new THREE.Group();
for (let i = 0; i < 12; i++) {
  const s = new THREE.Mesh(
    new THREE.OctahedronGeometry(0.01 + Math.random() * 0.02),
    new THREE.MeshPhysicalMaterial({
      color: 0x88ccff, roughness: 0, metalness: 0,
      transparent: true, opacity: 0.15 + Math.random() * 0.2,
      emissive: 0x4488ff, emissiveIntensity: 0.1,
    })
  );
  const a = Math.random() * Math.PI * 2;
  const r = 0.3 + Math.random() * 1.2;
  s.position.set(Math.cos(a)*r, 0.3+Math.random()*2.0, Math.sin(a)*r);
  s.rotation.set(Math.random()*6, Math.random()*6, Math.random()*6);
  s.userData = { rotSpeed: 0.005+Math.random()*0.01 };
  shardGroup.add(s);
}
scene.add(shardGroup);

// ─── Animation ───
let time = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = 0.016;
  time += dt;

  controls.update();

  // Cryo particles
  if (particles) {
    const pos = particles.geometry.getAttribute('position');
    const arr = pos.array;
    for (let i = 0; i < pData.length; i++) {
      const d = pData[i];
      arr[i*3+1] = d.baseY + Math.sin(time * d.speed + d.phase) * 0.15;
    }
    pos.needsUpdate = true;
  }

  // Shard rotation
  shardGroup.children.forEach(s => {
    s.rotation.x += s.userData.rotSpeed;
    s.rotation.y += s.userData.rotSpeed * 1.5;
  });

  // Idle animation
  if (window.__idleUpdate) window.__idleUpdate(dt);

  renderer.render(scene, camera);
}
animate();

// ─── Controls ───
document.getElementById('btn-spin').addEventListener('click', function() {
  controls.autoRotate = !controls.autoRotate;
  this.classList.toggle('on', controls.autoRotate);
});
document.getElementById('btn-idle').addEventListener('click', function() {
  if (window.__toggleIdle) {
    const on = this.classList.toggle('on');
    window.__toggleIdle(on);
  }
});
document.getElementById('btn-wire').addEventListener('click', function() {
  const on = this.classList.toggle('on');
  if (model) {
    model.traverse(c => {
      if (c.isMesh && c.material) {
        if (Array.isArray(c.material)) c.material.forEach(m => m.wireframe = on);
        else c.material.wireframe = on;
      }
    });
  }
});

// ─── Resize ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

console.log('✦ Ayaka 3D viewer initialized');
</script>
</body>
</html>
