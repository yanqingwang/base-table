<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>次卡管家 — Card Counter</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#5b5fc7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="次卡管家">
<style>
:root{--bg:#f5f5f7;--surface:#fff;--surface-2:#f8f8fa;--primary:#5b5fc7;--primary-light:#eef0ff;--primary-dark:#4347a0;--red:#e74c3c;--green:#27ae60;--orange:#f39c12;--gray:#999;--text:#1d1d1f;--text-2:#6e6e73;--radius:12px;--shadow:0 2px 12px rgba(0,0,0,.08)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.5;padding:0}
.container{max-width:960px;margin:0 auto;padding:16px}
.tab-bar{display:flex;background:var(--surface);border-bottom:1px solid #eee;position:sticky;top:0;z-index:50}
.tab{flex:1;padding:12px;text-align:center;cursor:pointer;font-size:14px;font-weight:500;color:var(--text-2);border-bottom:2px solid transparent;transition:.2s}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.tab-content{display:none}
.tab-content.active{display:block}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.header h1{font-size:20px;font-weight:700}
.btn{display:inline-flex;align-items:center;gap:4px;padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-size:13px;font-weight:500;transition:.2s}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-outline{background:transparent;border:1px solid var(--primary);color:var(--primary)}
.btn-outline:hover{background:var(--primary-light)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:4px 10px;font-size:12px}
.seg{display:inline-flex;background:var(--surface-2,#f0f0f3);border-radius:8px;padding:3px}
.seg-btn{border:none;background:transparent;padding:4px 12px;border-radius:6px;font-size:12px;color:var(--text-2,#666);cursor:pointer}
.seg-btn.active{background:var(--primary,#5b5fc7);color:#fff;font-weight:600}
.seg-label{font-size:12px;color:var(--text-2,#999);align-self:center;margin-right:4px}
.stats-bar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.stat{padding:12px 16px;background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);flex:1;min-width:100px}
.stat strong{font-size:24px;display:block;color:var(--primary)}
.stat .label{font-size:12px;color:var(--text-2)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;margin-bottom:16px}
.card-item{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;position:relative}
.card-item.expired{opacity:.6;border-left:3px solid var(--red)}
.card-item.low{background:#fff8f0;border-left:3px solid var(--orange)}
.card-item.bad{border-left:3px solid var(--red)}
.card-merchant{font-size:16px;font-weight:600}
.card-merchant .badge{display:inline-block;background:var(--red);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;margin-left:6px;vertical-align:middle}
.card-item-text{font-size:12px;color:var(--text-2);margin:4px 0}
.card-count{font-size:26px;font-weight:700;color:var(--primary)}
.card-count .total{font-size:14px;color:var(--text-2);font-weight:400}
.card-exp{font-size:11px;color:var(--text-2);margin:4px 0}
.card-exp.warning{color:var(--red);font-weight:500}
.card-suggestion{font-size:11px;color:var(--text-2);background:var(--surface-2);padding:6px 8px;border-radius:6px;margin:8px 0;line-height:1.4}
.card-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.star{color:#ddd;font-size:16px;cursor:pointer}
.star.active{color:#f1c40f}
.sort-bar{display:flex;gap:4px;align-items:center;margin-bottom:12px;font-size:12px;flex-wrap:wrap}
.sort-btn{padding:4px 10px;border:1px solid #ddd;border-radius:6px;background:var(--surface);cursor:pointer;font-size:12px}
.sort-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-light)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text-2)}
.empty-state .icon{font-size:40px;margin-bottom:12px}
.progress-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin:4px 0}
.progress-bar .fill{height:100%;border-radius:4px;transition:width .3s}
.progress-bar .fill.green{background:var(--green)}
.progress-bar .fill.orange{background:var(--orange)}
.progress-bar .fill.red{background:var(--red)}
.progress-bar .fill.blue{background:var(--primary)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;justify-content:center;align-items:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius);box-shadow:0 8px 40px rgba(0,0,0,.2);padding:24px;width:90%;max-width:500px;max-height:85vh;overflow-y:auto}
.modal h2{font-size:18px;margin-bottom:16px}
.modal-close{float:right;background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-2)}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:12px;font-weight:500;color:var(--text-2);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit}
.form-group input:focus,.form-group textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.cb-group{display:flex;gap:10px;flex-wrap:wrap;font-size:13px}
.cb-group label{display:flex;align-items:center;gap:4px;cursor:pointer;font-weight:400;color:var(--text)}
.cb-group input{width:14px;height:14px;accent-color:var(--primary)}
.checkin-counter{display:flex;align-items:center;gap:10px;justify-content:center;margin:12px 0}
.checkin-counter button{width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:var(--surface);font-size:18px;cursor:pointer}
.checkin-counter .count{font-size:28px;font-weight:700;min-width:36px;text-align:center;color:var(--primary)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:200;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:640px){.card-grid{grid-template-columns:1fr}.form-row{flex-direction:column}}
</style>
</head>
<body>

<div class="tab-bar" id="tabBar">
  <div class="tab active" data-tab="overview" onclick="switchTab('overview')">📊 总览</div>
  <div class="tab" data-tab="checkin" onclick="switchTab('checkin')">✅ 签到</div>
  <div class="tab" data-tab="stats" onclick="switchTab('stats')">📈 统计</div>
  <div class="tab" data-tab="reviews" onclick="switchTab('reviews')">⭐ 评价</div>
  <div class="tab" data-tab="settings" onclick="switchTab('settings')">⚙️ 我的</div>
</div>

<div class="container">

<!-- ==================== OVERVIEW TAB ==================== -->
<div class="tab-content active" id="tab-overview">
  <div class="header">
    <h1>📇 次卡管家</h1>
    <button class="btn btn-primary btn-sm" onclick="openQuotaForm()">+ 新增配额</button>
  </div>
  <div class="stats-bar" id="statsBar">
    <div class="stat"><strong id="statTotal">0</strong><span class="label">总配额</span></div>
    <div class="stat"><strong id="statRemaining">0</strong><span class="label">剩余次数</span></div>
    <div class="stat"><strong id="statExpiring">0</strong><span class="label">即将到期</span></div>
  </div>
  <div class="sort-bar">
    <span style="color:var(--text-2);margin-right:4px">排序:</span>
    <button class="sort-btn active" onclick="setSort('created')">最新</button>
    <button class="sort-btn" onclick="setSort('expire')">到期</button>
    <button class="sort-btn" onclick="setSort('remaining')">剩余</button>
    <button class="sort-btn" onclick="setSort('rating')">评分</button>
  </div>
  <div id="overviewGrid" class="card-grid"></div>
  <div id="overviewEmpty" class="empty-state" style="display:none">
    <div class="icon">📭</div>
    <p>还没有配额记录<br>点击上方"新增配额"开始使用</p>
  </div>
</div>

<!-- ==================== CHECKIN TAB ==================== -->
<div class="tab-content" id="tab-checkin">
  <div class="header"><h1>✅ 签到</h1></div>
  <div id="checkinQuotaList"></div>
  <div id="checkinEmpty" class="empty-state" style="display:none">
    <div class="icon">📭</div>
    <p>没有进行中的配额<br>请先在总览页面添加配额</p>
  </div>
  <div style="margin-top:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <h3 id="checkinRecordsTitle" style="font-size:14px">📋 今日签到记录</h3>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <div class="seg" id="checkinFilterSeg">
        <button class="seg-btn active" data-f="today" onclick="setCheckinFilter('today')">今天</button>
        <button class="seg-btn" data-f="month" onclick="setCheckinFilter('month')">最近一月</button>
        <button class="seg-btn" data-f="all" onclick="setCheckinFilter('all')">全部</button>
      </div>
      <div class="seg" id="checkinSortSeg">
        <span class="seg-label">排序</span>
        <button class="seg-btn active" data-s="time" onclick="setCheckinSort('time')">时间</button>
        <button class="seg-btn" data-s="quota" onclick="setCheckinSort('quota')">配额</button>
      </div>
    </div>
    <div id="todayCheckins"></div>
  </div>
</div>

<!-- ==================== STATS TAB ==================== -->
<div class="tab-content" id="tab-stats">
  <div class="header"><h1>📈 统计</h1></div>
  <div id="statsContent">
    <div class="stats-bar" id="detailStatsBar">
      <div class="stat"><strong id="statTotalQuota">0</strong><span class="label">总配额</span></div>
      <div class="stat"><strong id="statUsed">0</strong><span class="label">已用次数</span></div>
      <div class="stat"><strong id="statRemainTotal">0</strong><span class="label">剩余次数</span></div>
    </div>
    <div id="statsDetail"></div>
  </div>
</div>

<!-- ==================== REVIEWS TAB ==================== -->
<div class="tab-content" id="tab-reviews">
  <div class="header"><h1>⭐ 评价</h1></div>
  <div id="reviewList"></div>
  <div id="reviewEmpty" class="empty-state" style="display:none">
    <div class="icon">⭐</div>
    <p>还没有评价<br>签到后可对商家评分</p>
  </div>
</div>

<!-- ==================== SETTINGS TAB ==================== -->
<div class="tab-content" id="tab-settings">
  <div class="header"><h1>⚙️ 设置</h1></div>
  <div id="authSection"></div>
  <div style="background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px">
    <h3 style="font-size:14px;margin-bottom:12px">📅 学习规划配置</h3>
    <div class="form-group"><label>周末时段</label><input type="text" id="prefWeekend" placeholder="如：周六上午9-11点，周日下午3-5点"></div>
    <div class="form-group"><label>寒暑假时段</label><input type="text" id="prefHoliday" placeholder="如：每天上午9-11点，下午2-4点"></div>
    <div class="form-row">
      <div class="form-group"><label>工作日权重</label><input type="number" id="weightWeekday" value="1" min="0" step="0.5"></div>
      <div class="form-group"><label>周末权重</label><input type="number" id="weightWeekend" value="2" min="0" step="0.5"></div>
      <div class="form-group"><label>寒暑假权重</label><input type="number" id="weightHoliday" value="1.5" min="0" step="0.5"></div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="savePreferences()">保存偏好</button>
  </div>
  <div style="background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px">
    <h3 style="font-size:14px;margin-bottom:8px">💾 数据管理</h3>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn btn-primary btn-sm" onclick="manualSync()" id="manualSyncBtn">🔄 手动同步</button>
      <button class="btn btn-outline btn-sm" onclick="exportData()">导出备份</button>
      <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">导入恢复</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
    </div>
    <div id="syncStatus" style="font-size:12px;color:var(--gray);display:none"></div>
  </div>
  <div style="background:var(--surface);border:1px solid var(--red,#e74c3c);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:12px">
    <h3 style="font-size:14px;margin-bottom:6px;color:var(--red,#e74c3c)">⚠️ 谨慎操作</h3>
    <p style="font-size:12px;color:var(--text-2);margin-bottom:10px">以下操作会覆盖云端或清空数据，请确认后再执行。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-sm" style="background:var(--orange,#e67e22);color:#fff" onclick="forceUpload()" id="forceUploadBtn">⬆️ 强制上传</button>
      <button class="btn btn-danger btn-sm" onclick="resetData()">重置数据</button>
    </div>
  </div>
</div>

</div>

<!-- ==================== MODALS ==================== -->

<!-- Quota Form Modal -->
<div class="modal-overlay" id="quotaModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('quotaModal')">&times;</button>
    <h2 id="quotaFormTitle">新增配额</h2>
    <form onsubmit="saveQuota(event)">
      <input type="hidden" id="quotaFormId">
      <div class="form-group"><label>商家名称 *</label><input type="text" id="fMerchant" required placeholder="如：超级健身工作室"></div>
      <div class="form-group"><label>具体事项 *</label><input type="text" id="fItem" required placeholder="如：私教课（1小时）"></div>
      <div class="form-row">
        <div class="form-group"><label>金额 (元)</label><input type="number" id="fAmount" min="0" step="0.01"></div>
        <div class="form-group"><label>总次数 *</label><input type="number" id="fTotalTimes" min="1" value="10" required></div>
      </div>
      <div class="form-row">
        <div class="form-group"><label>到期时间</label><input type="date" id="fExpireDate"></div>
        <div class="form-group"><label>已用次数</label><input type="number" id="fUsedTimes" min="0" value="0"></div>
      </div>
      <div class="form-group"><label>学习偏好</label>
        <div class="cb-group" id="fPrefDays">
          <label><input type="checkbox" value="weekend" checked> 周末</label>
          <label><input type="checkbox" value="weekday"> 工作日</label>
          <label><input type="checkbox" value="holiday"> 假期</label>
          <label><input type="checkbox" value="winter_summer"> 寒暑假</label>
        </div>
      </div>
      <div class="form-group"><label>备注</label><textarea id="fNotes" rows="2"></textarea></div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" onclick="closeModal('quotaModal')">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- Checkin Modal -->
<div class="modal-overlay" id="checkinModal">
  <div class="modal" style="max-width:380px">
    <button class="modal-close" onclick="closeCheckin()">&times;</button>
    <h2>✅ 签到</h2>
    <p id="checkinInfo" style="font-size:13px;margin-bottom:12px;color:var(--text-2)"></p>
    <div class="form-group"><label>商家名称（可选）</label><input type="text" id="checkinMerchant" placeholder="本次消费商家"></div>
    <div class="checkin-counter">
      <button onclick="adjCheckin(-1)">−</button>
      <span class="count" id="checkinCount">1</span>
      <button onclick="adjCheckin(1)">+</button>
    </div>
    <p style="text-align:center;font-size:11px;color:var(--text-2)">扣减次数</p>
    <div class="form-group"><label>备注（可选）</label><input type="text" id="checkinNote" placeholder="本次消费备注"></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeCheckin()">取消</button>
      <button class="btn btn-primary" onclick="confirmCheckin()">确认签到</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <button class="modal-close" onclick="closeModal('detailModal')">&times;</button>
    <h2 id="detailTitle">详情</h2>
    <div id="detailContent"></div>
    <div class="form-actions"><button class="btn btn-primary" onclick="closeModal('detailModal')">关闭</button></div>
  </div>
</div>

<!-- Review Modal -->
<div class="modal-overlay" id="reviewModal">
  <div class="modal" style="max-width:360px">
    <button class="modal-close" onclick="closeModal('reviewModal')">&times;</button>
    <h2>⭐ 评价商家</h2>
    <p id="reviewMerchant" style="font-size:13px;margin-bottom:12px;color:var(--text-2)"></p>
    <div style="text-align:center;font-size:32px;margin:16px 0">
      <span class="star" data-v="1" onclick="setReviewStar(1)">★</span>
      <span class="star" data-v="2" onclick="setReviewStar(2)">★</span>
      <span class="star" data-v="3" onclick="setReviewStar(3)">★</span>
      <span class="star" data-v="4" onclick="setReviewStar(4)">★</span>
      <span class="star" data-v="5" onclick="setReviewStar(5)">★</span>
    </div>
    <div class="form-group"><label>评价内容（可选）</label><textarea id="reviewComment" rows="2"></textarea></div>
    <div class="form-actions">
      <button class="btn btn-outline" onclick="closeModal('reviewModal')">取消</button>
      <button class="btn btn-primary" onclick="confirmReview()">提交</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const LOCAL_KEY = 'card_counter_data';
const TOKEN_KEY = 'card_counter_token';
let localData = { quotas: [], checkins: [], ratings: [], preferences: {}, syncStatus: {} };
let currentSort = 'created';
let checkinTargetId = null;
let reviewTargetId = null;
let reviewStar = 0;
let currentUser = null;
let syncInProgress = false;
let checkinFilter = 'today'; // today | month | all
let checkinSort = 'time'; // time | quota

// ═══════════════════════════════════════════════════════════
// AUTH HELPERS
// ═══════════════════════════════════════════════════════════
function getToken() { return localStorage.getItem(TOKEN_KEY); }
function setToken(t) { if (t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }

function loggedIn() { return !!getToken(); }

async function apiFetch(path, opts) {
  opts = opts || {};
  const headers = opts.headers || {};
  headers['Content-Type'] = headers['Content-Type'] || 'application/json';
  const token = getToken();
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (opts.body && typeof opts.body === 'object') opts.body = JSON.stringify(opts.body);
  const res = await fetch(path, { ...opts, headers });
  const json = await res.json();
  if (json.code !== 0) throw new Error(json.errorMsg || '请求失败');
  return json.data;
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
async function init() {
  loadLocal();
  loadPreferences();

  // Check for token from URL hash (Official Account redirect)
  const hashToken = extractTokenFromHash();
  if (hashToken) {
    setToken(hashToken);
    history.replaceState(null, '', window.location.pathname);
  }

  // Try WeChat auto-login (Mini Program web-view)
  await tryWechatAutoLogin();

  renderAuthUI();
  renderAll();

  if (loggedIn()) {
    fetchUserInfo();
    syncFromServer();
    pushLocalPending();
  }
}

function extractTokenFromHash() {
  const hash = window.location.hash;
  const m = hash.match(/token=([^&]+)/);
  return m ? m[1] : null;
}

async function tryWechatAutoLogin() {
  try {
    const data = await apiFetch('/api/auth/wechat-login');
    if (data && data.token) {
      setToken(data.token);
      currentUser = data.user;
    }
  } catch(e) {
    // Not in Mini Program web-view — that's OK, use local mode
  }
}

async function fetchUserInfo() {
  try {
    currentUser = await apiFetch('/api/auth/me');
  } catch(e) {
    if (e.message.includes('401') || e.message.includes('未登录') || e.message.includes('过期')) {
      setToken(null);
      currentUser = null;
    }
  }
  renderAuthUI();
}

// ═══════════════════════════════════════════════════════════
// AUTH UI
// ═══════════════════════════════════════════════════════════
function renderAuthUI() {
  const el = document.getElementById('authSection');
  if (!el) return;

  if (loggedIn() && currentUser) {
    el.innerHTML = renderLoggedInUI();
  } else if (loggedIn()) {
    el.innerHTML =

async function handleRegister() {
  const username = document.getElementById('regUsername').value.trim();
  const password = document.getElementById('regPassword').value;
  const confirm = document.getElementById('regConfirm').value;
  const nickname = document.getElementById('regNickname').value.trim();

  if (username.length < 3) { toast('用户名至少3个字符'); return; }
  if (password.length < 6) { toast('密码至少6个字符'); return; }
  if (password !== confirm) { toast('两次密码输入不一致'); return; }

  try {
    const data = await apiFetch('/api/auth/register', {
      method: 'POST',
      body: { username, password, nickname: nickname || username },
    });
    setToken(data.token);
    currentUser = data.user;
    renderAuthUI();
    fetchUserInfo();
    syncFromServer();
    pushLocalPending();
    toast('注册成功！');
  } catch(e) {
    toast(e.message);
  }
}

async function handleLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!username || !password) { toast('请输入用户名和密码'); return; }

  try {
    const data = await apiFetch('/api/auth/login', {
      method: 'POST',
      body: { username, password },

    setToken(data.token);
    currentUser = data.user;
    renderAuthUI();
    fetchUserInfo();
    syncFromServer();
    pushLocalPending();
    toast('登录成功！');
  } catch(e) {
    toast(e.message);
  }
}

// ═══════════════════════════════════════════════════════════
// SERVER SYNC
// ═══════════════════════════════════════════════════════════
async function syncFromServer() {
  if (!loggedIn() || syncInProgress) return;
  syncInProgress = true;
  try {
    const [quotas, checkins, ratings] = await Promise.all([
      apiFetch('/api/quotas'),
      apiFetch('/api/checkins'),
      apiFetch('/api/ratings'),
    ]);
    let changed = false;
    for (const sq of quotas) {
      const local = localData.quotas.find(q => q.localId === sq.localId);
      if (!local) { localData.quotas.push(sq); changed = true; }
      else if ((sq.updatedAt || 0) > (local.updatedAt || 0)) { Object.assign(local, sq); changed = true; }
    }
    for (const sc of checkins) {
      const idx = localData.checkins.findIndex(c => c.localId === sc.localId);
      if (idx === -1) { localData.checkins.push(sc); changed = true; }
      else if ((sc.updatedAt || 0) > (localData.checkins[idx].updatedAt || 0)) { localData.checkins[idx] = sc; changed = true; }
    }
    for (const sr of ratings) {
      const idx = localData.ratings.findIndex(r => r.localId === sr.localId);
      if (idx === -1) { localData.ratings.push(sr); changed = true; }
      else if ((sr.createdAt || 0) > (localData.ratings[idx].createdAt || 0)) { localData.ratings[idx] = sr; changed = true; }
    }
    if (changed) saveLocal();
    renderAll();
  } catch(e) {
    console.warn('sync failed, using local data:', e.message);
  }
  syncInProgress = false;
}

// 推送本地数据到云端（仅推送云端没有的 localId；配额/签到/评价三类都推）
async function pushLocalPending() {
  if (!loggedIn()) return 0;
  let pushed = 0;
  try {
    const [cloudQuotas, cloudCheckins, cloudRatings] = await Promise.all([
      apiFetch('/api/quotas'),
      apiFetch('/api/checkins'),
      apiFetch('/api/ratings'),
    ]);
    const cqIds = new Set((cloudQuotas||[]).map(x => x.localId));
    const ccIds = new Set((cloudCheckins||[]).map(x => x.localId));
    const crIds = new Set((cloudRatings||[]).map(x => x.localId));
    // 先推签到/评价，最后推配额：配额 usedTimes 以本地为准覆盖，避免被签到累加二次计数
    for (const c of localData.checkins) {
      if (!c.localId || ccIds.has(c.localId)) continue;
      await pushToServer('checkins', c); pushed++;
    }
    for (const r of localData.ratings) {
      if (!r.localId || crIds.has(r.localId)) continue;
      await pushToServer('ratings', r); pushed++;
    }
    for (const q of localData.quotas) {
      if (!q.localId || cqIds.has(q.localId)) continue;
      await pushToServer('quotas', q); pushed++;
    }
  } catch(e) {
    console.warn('push local pending failed:', e.message);
  }
  return pushed;
}

// 手动同步：推送本地 + 拉取云端，并显示状态
async function manualSync() {
  if (!loggedIn()) { alert('请先登录'); return; }
  if (syncInProgress) return;
  const btn = document.getElementById('manualSyncBtn');
  const status = document.getElementById('syncStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 同步中...';
  status.style.display = 'block';
  status.textContent = '同步中...';
  try {
    // 1. 推送本地数据到云端（配额/签到/评价）
    const pushed = await pushLocalPending();
    // 2. 拉取云端数据
    await syncFromServer();
    status.textContent = '✅ 同步完成，已推送 ' + pushed + ' 条，拉取云端最新数据';
  } catch(e) {
    status.textContent = '❌ 同步失败: ' + (e.message || '网络错误');
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 手动同步';
    setTimeout(() => { status.style.display = 'none'; }, 4000);
  }
}

// 强制上传：忽略服务器是否已有，全量覆盖上传本地所有数据（找回历史数据 / 重建服务器用）
async function forceUpload() {
  if (!loggedIn()) { alert('请先登录'); return; }
  const total = localData.quotas.length + localData.checkins.length + localData.ratings.length;
  if (total === 0) { toast('本地暂无数据'); return; }
  if (!confirm('将本地全部 ' + total + ' 条数据（含历史签到记录）全量覆盖上传到云端，确定？')) return;
  if (syncInProgress) return;
  const btn = document.getElementById('forceUploadBtn');
  const status = document.getElementById('syncStatus');
  btn.disabled = true;
  btn.textContent = '⏳ 上传中...';
  status.style.display = 'block';
  status.textContent = '上传中...';
  try {
    // 先推签到/评价，最后推配额（配额 usedTimes 权威覆盖，避免被签到累加二次计数）
    for (const c of localData.checkins) { await pushToServer('checkins', c); }
    for (const r of localData.ratings) { await pushToServer('ratings', r); }
    for (const q of localData.quotas) { await pushToServer('quotas', q); }
    status.textContent = '✅ 强制上传完成，共 ' + total + ' 条';
  } catch(e) {
    status.textContent = '❌ 上传失败: ' + (e.message || '网络错误');
  } finally {
    btn.disabled = false;
    btn.textContent = '⬆️ 强制上传';
    setTimeout(() => { status.style.display = 'none'; }, 4000);
  }
}

async function pushToServer(collection, data) {
  if (!loggedIn()) return;
  try {
    const res = await apiFetch('/api/' + collection, { method: 'POST', body: data });
    if (res && res.id && collection !== 'quotas') {
      const list = collection === 'checkins' ? localData.checkins : localData.ratings;
      const item = list.find(x => x.localId === data.localId);
      if (item) { item.id = res.id; item._synced = true; }
      saveLocal();
    }
  } catch(e) {
    console.warn('push failed:', e.message);
  }
}

// ═══════════════════════════════════════════════════════════
// QUOTA HELPERS
// ═══════════════════════════════════════════════════════════
function calcStatus(q) {
  if (q.usedTimes >= q.totalTimes) return '已用完';
  if (q.expireDate && q.expireDate < todayStr()) return '已过期';
  return '进行中';
}

function todayStr() {
  const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function remaining(q) { return q.totalTimes - (q.usedTimes || 0); }

function daysUntil(exp) {
  if (!exp) return null;
  return Math.ceil((new Date(exp+'T23:59:59') - new Date()) / 86400000);
}

function calcSuggestion(q) {
  const rem = remaining(q);
  if (rem <= 0) return '已用完，无需安排';
  const du = daysUntil(q.expireDate);
  if (du !== null && du < 0) return '❌ 已过期' + Math.abs(du) + '天（剩余'+rem+'次）';
  if (du !== null && du <= 7) return '⚠️ 即将到期！建议'+du+'天内用完剩余'+rem+'次（每天至少'+Math.ceil(rem/du)+'次）';
  if (du !== null && du <= 30) {
    const pw = Math.ceil(rem / Math.ceil(du/7));
    return '⚠️ 距到期'+du+'天，建议每周至少'+pw+'次';
  }
  const pref = localData.preferences || {};
  const wDay = pref.weekdayWeight || 1;
  const wEnd = pref.weekendWeight || 2;
  let weekendDays = 0, weekdayDays = 0;
  const now = new Date();
  for (let i = 0; i < 30; i++) {
    const d = new Date(now); d.setDate(d.getDate()+i);
    const day = d.getDay();
    if (day === 0 || day === 6) weekendDays++;
    else weekdayDays++;
  }
  const weightedDays = weekdayDays * wDay + weekendDays * wEnd;
  const interval = Math.ceil(weightedDays / rem);
  return '建议每' + interval + '天参加一次（剩余'+rem+'次）';
}

function renderStars(rating, clickable, onChange) {
  let h = '';
  for (let i = 1; i <= 5; i++) {
    const cls = 'star' + (i <= rating ? ' active' : '');
    h += '<span class="'+cls+'" data-v="'+i+'"';
    if (clickable) h += ' onclick="'+onChange+'('+i+')"';
    h += '>★</span>';
  }
  return h;
}

function esc(s) {
  const div = document.createElement('div');
  div.appendChild(document.createTextNode(s));
  return div.innerHTML;
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function renderAll() { renderOverview(); renderCheckinTab(); renderStatsTab(); renderReviewTab(); }

function renderOverview() {
  const quotas = localData.quotas;
  document.getElementById('statTotal').textContent = quotas.length;
  document.getElementById('statRemaining').textContent = quotas.reduce((s,q) => s + remaining(q), 0);
  document.getElementById('statExpiring').textContent = quotas.filter(q => {
    const du = daysUntil(q.expireDate); return du !== null && du >= 0 && du <= 14;
  }).length;
  const empty = document.getElementById('overviewEmpty');
  const grid = document.getElementById('overviewGrid');
  if (quotas.length === 0) { empty.style.display = 'block'; grid.innerHTML = ''; return; }
  empty.style.display = 'none';
  const sorted = [...quotas].sort((a,b) => {
    switch(currentSort) {
      case 'expire': return (a.expireDate||'9999').localeCompare(b.expireDate||'9999');
      case 'remaining': return remaining(a) - remaining(b);
      case 'rating': {
        const ra = localData.ratings.find(r => r.merchant === a.merchant);
        const rb = localData.ratings.find(r => r.merchant === b.merchant);
        return (ra ? ra.score : 999) - (rb ? rb.score : 999);
      }
      default: return 0;
    }
  });
  grid.innerHTML = sorted.map(q => {
    const rem = remaining(q);
    const status = calcStatus(q);
    const du = daysUntil(q.expireDate);
    const exp = q.expireDate ? `<div class="card-exp${du !== null && du <= 14 ? ' warning' : ''}">到期: ${q.expireDate}${du !== null ? ' ('+(du>0?du+'天后':'已过期')+')' : ''}</div>` : '';
    const cls = status === '已过期' ? 'card-item expired' : (status === '已用完' ? 'card-item expired' : (rem <= Math.ceil(q.totalTimes*0.2) ? 'card-item low' : 'card-item'));
    const rating = localData.ratings.find(r => r.merchant === q.merchant);
    const isBad = rating && rating.score <= 2;
    const finalCls = isBad ? cls + ' bad' : cls;
    const badge = isBad ? '<span class="badge">⚠️ 避雷</span>' : '';
    const suggestion = calcSuggestion(q);
    return `<div class="${finalCls}">
      <div class="card-merchant">${esc(q.merchant)}${badge}</div>
      <div class="card-item-text">${esc(q.item)} ${q.amount ? '· ¥'+q.amount : ''}</div>
      <div><span class="card-count">${rem}<span class="total">/${q.totalTimes}</span></span> 次 <span style="font-size:11px;color:var(--text-2)">(${status})</span></div>
      ${exp}
      <div class="card-suggestion">💡 ${suggestion}</div>
      <div class="card-actions">
        <button class="btn btn-primary btn-sm" onclick="openCheckin('${q.localId}')" ${rem<=0?'disabled':''}>✅ 签到</button>
        <button class="btn btn-outline btn-sm" onclick="editQuota('${q.localId}')">✏️ 编辑</button>
        <button class="btn btn-outline btn-sm" onclick="showDetail('${q.localId}')">📊 详情</button>
        <button class="btn btn-outline btn-sm" onclick="openReview('${q.merchant}')">⭐ 评价</button>
        <button class="btn btn-danger btn-sm" onclick="deleteQuota('${q.localId}')">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function renderCheckinTab() {
  const active = localData.quotas.filter(q => calcStatus(q) === '进行中');
  const el = document.getElementById('checkinQuotaList');
  const empty = document.getElementById('checkinEmpty');
  if (active.length === 0) { empty.style.display = 'block'; el.innerHTML = ''; } else {
    empty.style.display = 'none';
    el.innerHTML = active.map(q => {
      const rem = remaining(q);
      return `<div class="card-item" style="margin-bottom:8px;cursor:pointer" onclick="openCheckin('${q.localId}')">
        <div class="card-merchant">${esc(q.merchant)}</div>
        <div class="card-item-text">${esc(q.item)} · 剩余 <strong>${rem}</strong>/${q.totalTimes} 次</div>
      </div>`;
    }).join('');
  }
  const today = todayStr();
  const monthAgo = monthAgoStr();
  let list = localData.checkins.filter(c => !c.isRevoked);
  if (checkinFilter === 'today') list = list.filter(c => c.checkinDate === today);
  else if (checkinFilter === 'month') list = list.filter(c => (c.checkinDate || '') >= monthAgo);
  // 'all' 不做日期过滤
  if (checkinSort === 'time') {
    list.sort((a, b) => (b.checkinDate || '').localeCompare(a.checkinDate || '') || (b.checkinTime || '').localeCompare(a.checkinTime || ''));
  } else {
    list.sort((a, b) => checkinMerchant(a).localeCompare(checkinMerchant(b)) || (b.checkinDate || '').localeCompare(a.checkinDate || '') || (b.checkinTime || '').localeCompare(a.checkinTime || ''));
  }
  const titleEl = document.getElementById('checkinRecordsTitle');
  const labels = { today: '今天', month: '最近一月', all: '全部' };
  if (titleEl) titleEl.textContent = `📋 ${labels[checkinFilter]}签到记录（${list.length}）`;
  document.querySelectorAll('#checkinFilterSeg .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.f === checkinFilter));
  document.querySelectorAll('#checkinSortSeg .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.s === checkinSort));
  const tcEl = document.getElementById('todayCheckins');
  if (list.length === 0) {
    tcEl.innerHTML = '<div style="font-size:13px;color:var(--text-2)">该时间范围内暂无签到记录</div>';
  } else {
    tcEl.innerHTML = list.map(c => {
      const m = checkinMerchant(c);
      return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface);border-radius:8px;margin-bottom:6px;font-size:13px">
        <span>${esc(m)} · 扣${c.deductTimes}次${c.note ? ' · ' + esc(c.note) : ''}<br><span style="font-size:11px;color:var(--text-2)">${c.checkinDate} ${c.checkinTime}</span></span>
        <button class="btn btn-sm btn-outline" style="border-color:var(--red);color:var(--red)" onclick="revokeCheckin('${c.localId}')">撤销</button>
      </div>`;
    }).join('');
  }
}

function checkinMerchant(c) {
  const q = localData.quotas.find(q => q.localId === c.quotaId);
  return q ? q.merchant : (c.merchant || '');
}

function monthAgoStr() {
  const d = new Date();
  d.setDate(d.getDate() - 30);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

function setCheckinFilter(f) { checkinFilter = f; renderCheckinTab(); }
function setCheckinSort(s) { checkinSort = s; renderCheckinTab(); }

function renderStatsTab() {
  const quotas = localData.quotas;
  document.getElementById('statTotalQuota').textContent = quotas.length;
  document.getElementById('statUsed').textContent = quotas.reduce((s,q) => s + (q.usedTimes||0), 0);
  document.getElementById('statRemainTotal').textContent = quotas.reduce((s,q) => s + remaining(q), 0);
  if (quotas.length === 0) { document.getElementById('statsDetail').innerHTML = '<div class="empty-state"><p>暂无数据</p></div>'; return; }
  const merchantStats = {};
  quotas.forEach(q => {
    if (!merchantStats[q.merchant]) merchantStats[q.merchant] = { merchant: q.merchant, total: 0, used: 0, remaining: 0 };
    merchantStats[q.merchant].total += q.totalTimes;
    merchantStats[q.merchant].used += q.usedTimes || 0;
    merchantStats[q.merchant].remaining += remaining(q);
  });
  localData.ratings.forEach(r => {
    if (merchantStats[r.merchant]) merchantStats[r.merchant].rating = r.score;
  });
  let html = '<h3 style="font-size:14px;margin:16px 0 8px">📊 商家使用进度</h3>';
  html += Object.values(merchantStats).map(m => {
    const pct = m.total > 0 ? Math.round((m.used / m.total) * 100) : 0;
    const barColor = pct >= 80 ? 'green' : pct >= 50 ? 'orange' : 'blue';
    return `<div style="padding:8px 12px;background:var(--surface);border-radius:8px;margin-bottom:6px;font-size:13px">
      <div style="display:flex;justify-content:space-between;margin-bottom:2px">
        <span>${esc(m.merchant)} ${m.rating ? renderStars(m.rating, false) : ''}</span>
        <span>${m.used}/${m.total} 次</span>
      </div>
      <div class="progress-bar"><div class="fill ${barColor}" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-2)">
        <span>已用 ${pct}%</span>
        <span>剩余 ${m.remaining} 次</span>
      </div>
    </div>`;
  }).join('');
  const totalRem = quotas.reduce((s,q) => s + remaining(q), 0);
  if (totalRem > 0) {
    let interval = Math.ceil(30 / Math.max(totalRem/30, 1));
    html += '<div style="margin-top:16px;padding:12px;background:var(--surface);border-radius:8px;font-size:13px">';
    html += '📋 综合建议：剩余 <strong>'+totalRem+'</strong> 次，建议平均每 <strong>'+interval+'</strong> 天参加一次</div>';
  }
  document.getElementById('statsDetail').innerHTML = html;
}

function renderReviewTab() {
  const ratings = localData.ratings;
  const el = document.getElementById('reviewList');
  const empty = document.getElementById('reviewEmpty');
  if (ratings.length === 0) { empty.style.display = 'block'; el.innerHTML = ''; return; }
  empty.style.display = 'none';
  ratings.sort((a,b) => (b.createdAt||0) - (a.createdAt||0));
  el.innerHTML = ratings.map(r => {
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border-radius:8px;margin-bottom:6px">
      <div>
        <div style="font-weight:500">${esc(r.merchant)}</div>
        <div>${renderStars(r.score, false)}${r.comment ? ' · '+esc(r.comment) : ''}</div>
      </div>
      <button class="btn btn-sm btn-outline" onclick="deleteReview('${r.localId}')">删除</button>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════════
// QUOTA CRUD
// ═══════════════════════════════════════════════════════════
function openQuotaForm() {
  document.getElementById('quotaFormTitle').textContent = '新增配额';
  document.getElementById('quotaFormId').value = '';
  document.getElementById('fMerchant').value = '';
  document.getElementById('fItem').value = '';
  document.getElementById('fAmount').value = '';
  document.getElementById('fTotalTimes').value = '10';
  document.getElementById('fUsedTimes').value = '0';
  document.getElementById('fExpireDate').value = '';
  document.getElementById('fNotes').value = '';
  document.querySelectorAll('#fPrefDays input').forEach(cb => cb.checked = cb.value === 'weekend');
  document.getElementById('quotaModal').classList.add('open');
}

function editQuota(id) {
  const q = localData.quotas.find(x => x.localId === id);
  if (!q) return;
  document.getElementById('quotaFormTitle').textContent = '编辑配额';
  document.getElementById('quotaFormId').value = id;
  document.getElementById('fMerchant').value = q.merchant || '';
  document.getElementById('fItem').value = q.item || '';
  document.getElementById('fAmount').value = q.amount || '';
  document.getElementById('fTotalTimes').value = q.totalTimes || 1;
  document.getElementById('fUsedTimes').value = q.usedTimes || 0;
  document.getElementById('fExpireDate').value = q.expireDate || '';
  document.getElementById('fNotes').value = q.note || '';
  const prefDays = (q.preferences && q.preferences.days) || ['weekend'];
  document.querySelectorAll('#fPrefDays input').forEach(cb => { cb.checked = prefDays.includes(cb.value); });
  document.getElementById('quotaModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function saveQuota(e) {
  e.preventDefault();
  const id = document.getElementById('quotaFormId').value;
  const prefDays = Array.from(document.querySelectorAll('#fPrefDays input:checked')).map(cb => cb.value);
  const totalTimes = parseInt(document.getElementById('fTotalTimes').value) || 1;
  const usedTimes = Math.min(parseInt(document.getElementById('fUsedTimes').value) || 0, totalTimes);
  const data = {
    localId: id || genId(),
    merchant: document.getElementById('fMerchant').value.trim(),
    item: document.getElementById('fItem').value.trim(),
    amount: parseFloat(document.getElementById('fAmount').value) || 0,
    totalTimes, usedTimes,
    expireDate: document.getElementById('fExpireDate').value,
    note: document.getElementById('fNotes').value.trim(),
    preferences: { days: prefDays },
    updatedAt: Date.now(),
  };
  if (id) {
    const idx = localData.quotas.findIndex(x => x.localId === id);
    if (idx >= 0) localData.quotas[idx] = data;
  } else {
    localData.quotas.push(data);
  }
  saveLocal();
  pushToServer('quotas', data);
  closeModal('quotaModal');
  renderAll();
  toast(id ? '配额已更新' : '配额已添加');
}

async function deleteQuota(id) {
  if (!confirm('确定删除该配额吗？')) return;
  localData.quotas = localData.quotas.filter(q => q.localId !== id);
  saveLocal();
  renderAll();
  toast('已删除');
}

// ═══════════════════════════════════════════════════════════
// CHECKIN
// ═══════════════════════════════════════════════════════════
function openCheckin(id) {
  checkinTargetId = id;
  const q = localData.quotas.find(x => x.localId === id);
  if (!q || remaining(q) <= 0) { toast('该配额已用完'); return; }
  document.getElementById('checkinInfo').textContent = q.merchant + ' · ' + q.item + '（剩余' + remaining(q) + '次）';
  document.getElementById('checkinMerchant').value = '';
  document.getElementById('checkinNote').value = '';
  document.getElementById('checkinCount').textContent = '1';
  document.getElementById('checkinModal').classList.add('open');
}

function closeCheckin() {
  document.getElementById('checkinModal').classList.remove('open');
  checkinTargetId = null;
}

function adjCheckin(delta) {
  const el = document.getElementById('checkinCount');
  let v = parseInt(el.textContent) + delta;
  const q = localData.quotas.find(x => x.localId === checkinTargetId);
  if (v < 1) v = 1;
  if (q && v > remaining(q)) v = remaining(q);
  el.textContent = v;
}

async function confirmCheckin() {
  if (!checkinTargetId) return;
  const q = localData.quotas.find(x => x.localId === checkinTargetId);
  if (!q) return;
  if (q.expireDate && q.expireDate < todayStr()) { toast('该配额已过期'); closeCheckin(); return; }
  const count = parseInt(document.getElementById('checkinCount').textContent);
  const now = new Date();
  const ci = {
    localId: genId(),
    quotaId: checkinTargetId,
    merchant: document.getElementById('checkinMerchant').value.trim() || q.merchant,
    deductTimes: count,
    checkinDate: todayStr(),
    checkinTime: now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0'),
    note: document.getElementById('checkinNote').value.trim(),
    isRevoked: false,
    updatedAt: Date.now(),
    _synced: false,
  };
  q.usedTimes = (q.usedTimes || 0) + count;
  q.updatedAt = Date.now();
  localData.checkins.push(ci);
  saveLocal();
  await pushCheckin(ci);
  closeCheckin();
  renderAll();
  toast('✅ 签到成功，扣减'+count+'次');
}

async function pushCheckin(ci) {
  if (!loggedIn()) return false;
  try {
    const res = await apiFetch('/api/checkins', { method: 'POST', body: ci });
    ci.id = res && res.id ? res.id : ci.id;
    ci._synced = true;
    ci.updatedAt = Date.now();
    saveLocal();
    return true;
  } catch(e) {
    console.warn('checkin push failed:', e.message);
    ci._synced = false;
    saveLocal();
    return false;
  }
}

async function revokeCheckin(id) {
  if (!confirm('确定撤销该签到记录？')) return;
  const ci = localData.checkins.find(c => c.localId === id);
  if (!ci) return;
  ci.isRevoked = true;
  ci.updatedAt = Date.now();
  const q = localData.quotas.find(x => x.localId === ci.quotaId);
  if (q) { q.usedTimes = Math.max(0, (q.usedTimes||0) - ci.deductTimes); q.updatedAt = Date.now(); }
  saveLocal();
  if (loggedIn()) {
    if (ci.id) {
      apiFetch('/api/checkins/' + ci.id + '/revoke', { method: 'POST' })
        .then(() => { ci._synced = true; saveLocal(); })
        .catch(() => { ci._synced = false; saveLocal(); });
    } else {
      pushCheckin(ci); // 未推送过的记录：带 isRevoked 上传，服务端直接按已撤销创建
    }
  }
  renderAll();
  toast('已撤销签到');
}

// ═══════════════════════════════════════════════════════════
// DETAIL
// ═══════════════════════════════════════════════════════════
function showDetail(id) {
  const q = localData.quotas.find(x => x.localId === id);
  if (!q) return;
  const checkins = localData.checkins.filter(c => c.quotaId === id && !c.isRevoked).sort((a,b) => b.checkinTime.localeCompare(a.checkinTime));
  const rating = localData.ratings.find(r => r.merchant === q.merchant);
  const prefDays = (q.preferences && q.preferences.days) || [];
  const dayLabels = {weekend:'周末',weekday:'工作日',holiday:'假期',winter_summer:'寒暑假'};
  let html = '<table style="width:100%;border-collapse:collapse;font-size:13px">';
  html += '<tr><td style="padding:4px 8px;color:var(--text-2);width:70px">商家</td><td style="padding:4px 8px"><strong>'+esc(q.merchant)+'</strong></td></tr>';
  html += '<tr><td style="padding:4px 8px;color:var(--text-2)">事项</td><td style="padding:4px 8px">'+esc(q.item)+'</td></tr>';
  html += '<tr><td style="padding:4px 8px;color:var(--text-2)">金额</td><td style="padding:4px 8px">¥'+(q.amount||0)+'</td></tr>';
  html += '<tr><td style="padding:4px 8px;color:var(--text-2)">次数</td><td style="padding:4px 8px">已用 <strong>'+(q.usedTimes||0)+'</strong> / '+q.totalTimes+' · 剩余 '+remaining(q)+'</td></tr>';
  html += '<tr><td style="padding:4px 8px;color:var(--text-2)">状态</td><td style="padding:4px 8px">'+calcStatus(q)+'</td></tr>';
  if (q.expireDate) html += '<tr><td style="padding:4px 8px;color:var(--text-2)">到期</td><td style="padding:4px 8px">'+q.expireDate+'</td></tr>';
  html += '<tr><td style="padding:4px 8px;color:var(--text-2)">偏好</td><td style="padding:4px 8px">'+prefDays.map(d => dayLabels[d]||d).join('、')+'</td></tr>';
  if (rating) html += '<tr><td style="padding:4px 8px;color:var(--text-2)">评分</td><td style="padding:4px 8px">'+renderStars(rating.score, false)+'</td></tr>';
  if (q.note) html += '<tr><td style="padding:4px 8px;color:var(--text-2)">备注</td><td style="padding:4px 8px">'+esc(q.note)+'</td></tr>';
  html += '</table>';
  html += '<div style="margin-top:12px;padding:8px;background:var(--surface-2);border-radius:6px;font-size:12px">💡 '+calcSuggestion(q)+'</div>';
  if (checkins.length > 0) {
    html += '<div style="margin-top:12px"><strong style="font-size:13px">📝 签到记录</strong></div>';
    checkins.slice(0,10).forEach(c => {
      html += '<div style="font-size:12px;padding:4px 0;border-bottom:1px solid #eee">'+c.checkinDate+' 扣'+c.deductTimes+'次'+(c.merchant&&c.merchant!==q.merchant?' @'+esc(c.merchant):'')+(c.note?' · '+esc(c.note):'')+'</div>';
    });
    if (checkins.length > 10) html += '<div style="font-size:11px;color:var(--text-2);margin-top:4px">共'+checkins.length+'条记录</div>';
  }
  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailTitle').textContent = '📋 '+q.merchant+' - '+q.item;
  document.getElementById('detailModal').classList.add('open');
}

// ═══════════════════════════════════════════════════════════
// REVIEWS
// ═══════════════════════════════════════════════════════════
function openReview(merchant) {
  reviewTargetId = merchant;
  const existing = localData.ratings.find(r => r.merchant === merchant);
  reviewStar = existing ? existing.score : 0;
  document.getElementById('reviewMerchant').textContent = '评价：'+merchant;
  document.getElementById('reviewComment').value = existing ? (existing.comment||'') : '';
  updateReviewStars();
  document.getElementById('reviewModal').classList.add('open');
}

function setReviewStar(v) { reviewStar = v; updateReviewStars(); }

function updateReviewStars() {
  document.querySelectorAll('#reviewModal .star').forEach(el => {
    el.classList.toggle('active', parseInt(el.dataset.v) <= reviewStar);
  });
}

async function confirmReview() {
  if (reviewStar < 1) { toast('请选择评分'); return; }
  const idx = localData.ratings.findIndex(r => r.merchant === reviewTargetId);
  const data = {
    localId: idx >= 0 ? localData.ratings[idx].localId : genId(),
    merchant: reviewTargetId,
    score: reviewStar,
    comment: document.getElementById('reviewComment').value.trim(),
    createdAt: Date.now(),
  };
  if (idx >= 0) localData.ratings[idx] = data;
  else localData.ratings.push(data);
  saveLocal();
  pushToServer('ratings', data);
  closeModal('reviewModal');
  renderAll();
  toast('⭐ 评价已提交');
}

function deleteReview(id) {
  if (!confirm('确定删除评价？')) return;
  localData.ratings = localData.ratings.filter(r => r.localId !== id);
  saveLocal();
  renderAll();
  toast('评价已删除');
}

// ═══════════════════════════════════════════════════════════
// UTILITIES
// ═══════════════════════════════════════════════════════════
function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.toggle('active', c.id === 'tab-'+name));
}

function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.toggle('active', b.textContent.trim().includes({created:'最新',expire:'到期',remaining:'剩余',rating:'评分'}[s])));
  renderOverview();
}

function toast(msg) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), 2500);
}

function savePreferences() {
  localData.preferences = {
    weekendHours: document.getElementById('prefWeekend').value.trim(),
    holidayHours: document.getElementById('prefHoliday').value.trim(),
    weekdayWeight: parseFloat(document.getElementById('weightWeekday').value) || 1,
    weekendWeight: parseFloat(document.getElementById('weightWeekend').value) || 2,
    holidayWeight: parseFloat(document.getElementById('weightHoliday').value) || 1.5,
  };
  saveLocal();
  renderAll();
  toast('偏好已保存');
}

function exportData() {
  const content = JSON.stringify(localData, null, 2);
  const filename = 'card-counter-backup-' + todayStr() + '.json';
  if (window.showSaveFilePicker) {
    window.showSaveFilePicker({
      suggestedName: filename,
      types: [{ description: 'JSON 备份', accept: { 'application/json': ['.json'] } }],
    })
      .then(handle => handle.createWritable())
      .then(writable => writable.write(content).then(() => writable.close()))
      .then(() => toast('备份已保存'))
      .catch(err => {
        if (err.name !== 'AbortError') fallbackExport(filename, content);
      });
  } else {
    fallbackExport(filename, content);
  }
}

function fallbackExport(filename, content) {
  const blob = new Blob([content], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  toast('备份已下载');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(ev) {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.quotas) localData.quotas = data.quotas;
      if (data.checkins) localData.checkins = data.checkins;
      if (data.ratings) localData.ratings = data.ratings;
      if (data.preferences) localData.preferences = data.preferences;
      saveLocal();
      loadPreferences();
      renderAll();
      toast('数据已恢复');
    } catch(err) { toast('导入失败: 文件格式错误'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function resetData() {
  if (!confirm('确定重置所有数据？此操作不可恢复！')) return;
  localData = { quotas: [], checkins: [], ratings: [], preferences: {}, syncStatus: {} };
  saveLocal();
  renderAll();
  toast('数据已重置');
}
