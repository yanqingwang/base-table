{% extends "base.html" %}
{% block content %}
<div class="error-page">
    <h2>⚠️ API Error</h2>
    <p style="color:#666;margin-bottom:20px">Failed to connect to DocuSign {{ env.upper() }} environment.</p>
    <pre>{{ error }}</pre>
    <a href="{{ '/' if env == 'prd' else '/dev' }}" class="btn" style="margin-top:16px">← Back to Dashboard</a>
</div>
{% endblock %}
